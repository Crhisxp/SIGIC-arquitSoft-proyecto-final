name: SIGIC SDD Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  sdd-gate:
    name: SDD Governance, Concurrency & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Domain Unit & Concurrency Tests
        run: |
          dotnet test tests/SIGIC.Domain.Tests/SIGIC.Domain.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults --logger "trx;LogFileName=domain_gate.trx"

      - name: Verify Documentation Wikilinks Absence
        shell: bash
        run: |
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF'
          import os
          import re
          import sys

          repo_root = os.path.abspath(".")
          exclude_dirs = set([".git", "node_modules", "bin", "obj", ".obsidian", "TestResults", "build", ".system_generated"])
          violations = []

          for root, dirs, files in os.walk(repo_root):
              dirs[:] = [d for d in dirs if d not in exclude_dirs]
              for f in files:
                  if f.endswith(".md"):
                      path = os.path.join(root, f)
                      with open(path, "r", encoding="utf-8") as fh:
                          c = fh.read()
                      c_no_blocks = re.sub(r'```.*?```', '', c, flags=re.DOTALL)
                      c_no_inline = re.sub(r'`[^`]*`', '', c_no_blocks)
                      matches = re.findall(r'\[\[(.*?)\]\]', c_no_inline)
                      if matches:
                          rel = os.path.relpath(path, repo_root)
                          violations.append((rel, matches))

          if violations:
              print(f"❌ ERROR: Detectados wikilinks no permitidos en {len(violations)} archivos:", file=sys.stderr)
              for p, m in violations:
                  print(f"  - {p}: {m}", file=sys.stderr)
              sys.exit(1)
          else:
              print("✅ AUDITORÍA SUPERADA: Cero wikilinks detectados en documentación propia.")
          EOF


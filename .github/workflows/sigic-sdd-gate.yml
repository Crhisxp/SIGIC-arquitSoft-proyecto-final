          def extract_links(fp):
              with open(fp, "r", encoding="utf-8") as f:
                  content = f.read()
              no_blocks = re.sub(r'```.*?```', '', content, flags=re.DOTALL)
              no_inline = re.sub(r'`[^`]*`', '', no_blocks)
              pattern = re.compile(r'\[([^\]]*)\]\(([^)]+)\)')
              file_dir = os.path.dirname(fp)
              links = []
              for m in pattern.finditer(no_inline):
                  target = m.group(2).strip()
                  if target.startswith('#') or target.startswith('http://') or target.startswith('https://') or target.startswith('mailto:'):
                      continue
                  target_no_anchor = target.split('#')[0].strip()
                  if not target_no_anchor:
                      continue
                  resolved = os.path.normpath(os.path.join(file_dir, target_no_anchor))
                  rel = os.path.relpath(resolved, repo_root)
                  if rel not in links:
                      links.append(rel)
              return links

          visited = set(["AGENTS.md"])
          queue = ["AGENTS.md"]
          adj = {}
          edges = []
          broken = []
          excess = []

          while queue:
              curr = queue.pop(0)
              curr_path = os.path.join(repo_root, curr)
              if not os.path.exists(curr_path):
                  broken.append(curr)
                  continue
              if curr.endswith('.md'):
                  targets = extract_links(curr_path)
                  adj[curr] = targets
                  if len(targets) > 4:
                      excess.append((curr, len(targets)))
                  for t in targets:
                      edge = (curr, t)
                      if edge not in edges:
                          edges.append(edge)
                      t_path = os.path.join(repo_root, t)
                      if not os.path.exists(t_path):
                          broken.append((curr, t))
                      if t not in visited:
                          visited.add(t)
                          queue.append(t)
              else:
                  adj[curr] = []

          # Cycle check
          WHITE, GRAY, BLACK = 0, 1, 2
          state = {n: WHITE for n in visited}
          has_cycle = False
          cycle_path = []

          def dfs(n, path):
              global has_cycle, cycle_path
              state[n] = GRAY
              for nxt in adj.get(n, []):
                  if nxt not in state:
                      continue
                  if state[nxt] == GRAY:
                      has_cycle = True
                      cycle_path = path + [nxt]
                      return
                  elif state[nxt] == WHITE:
                      dfs(nxt, path + [nxt])
                      if has_cycle:
                          return
              state[n] = BLACK

          dfs("AGENTS.md", ["AGENTS.md"])

          errors = []
          if len(visited) != 79:
              errors.append(f"Cantidad de nodos incorrecta: esperados 79, obtenidos {len(visited)}")
          if len(edges) != 96:
              errors.append(f"Cantidad de aristas incorrecta: esperadas 96, obtenidas {len(edges)}")
          if has_cycle:
              errors.append(f"Ciclo detectado en el grafo documental: {' -> '.join(cycle_path)}")
          if excess:
              errors.append(f"Nodos con más de 4 destinos salientes: {excess}")
          if broken:
              errors.append(f"Enlaces rotos o destinos inexistentes: {broken}")

          exp_nodes_set = set(EXPECTED_NODES)
          exp_edges_set = set(tuple(e) for e in EXPECTED_EDGES)
          actual_edges_set = set(edges)

          if visited != exp_nodes_set:
              errors.append(f"Conjunto de nodos difiere. Faltantes: {exp_nodes_set - visited}, Extras: {visited - exp_nodes_set}")
          if actual_edges_set != exp_edges_set:
              errors.append(f"Conjunto de aristas difiere. Faltantes: {exp_edges_set - actual_edges_set}, Extras: {actual_edges_set - exp_edges_set}")

          if errors:
              print("❌ ERROR: Violación de la topología canónica SDD:", file=sys.stderr)
              for e in errors:
                  print("  - " + e, file=sys.stderr)
              sys.exit(1)
          else:
              print("✅ AUDITORÍA SUPERADA: DAG canónico íntegro (79 nodos, 96 aristas, 0 ciclos, max 4 salientes, conjuntos idénticos).")
          EOF

name: CI/CD Pipeline - SIGIC Ferretería v2.2

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-verify:
    name: .NET 8, PostgreSQL 16, PgBouncer 1.22.1 & Domain coverage >=95%
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: ["postgres", "-c", "max_connections=300"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sigic_ci_ephemeral
          POSTGRES_DB: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    # Ephemeral credentials shared with PostgreSqlTestFixture; no production secrets.
    env:
      SIGIC_DB_HOST: 127.0.0.1
      SIGIC_DB_PORT: '54329'
      SIGIC_DB_NAME: postgres
      SIGIC_DB_ADMIN_USER: postgres
      SIGIC_DB_ADMIN_PASSWORD: sigic_ci_ephemeral
      SIGIC_DB_USER: sigic_app
      SIGIC_DB_PASSWORD: sigic_fixture_ephemeral
      SIGIC_POS_CONNECTION_STRING: Host=127.0.0.1;Port=6432;Database=sigic_pos_pool;Username=sigic_app;Password=sigic_fixture_ephemeral;Pooling=false
      SIGIC_WEB_CONNECTION_STRING: Host=127.0.0.1;Port=6432;Database=sigic_web_pool;Username=sigic_app;Password=sigic_fixture_ephemeral;Pooling=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pooler build and PostgreSQL client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client build-essential pkg-config libevent-dev libssl-dev curl
      - name: Verify coverage aggregation regressions
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Bootstrap schema, SCRAM and PgBouncer 1.22.1; verify both pools
        run: bash scripts/ci/bootstrap.sh
      - name: Restore
        run: dotnet restore SIGIC.sln
      - name: Build Release with warnings as errors
        run: dotnet build SIGIC.sln --configuration Release --no-restore -warnaserror
      - name: Four sequential suites, TRX and merged line coverage
        run: bash scripts/ci/test-backend.sh
      - name: Capture sanitized service diagnostics on failure
        if: failure()
        env:
          SIGIC_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p TestResults/diagnostics
          if test -n "${SIGIC_POOL_DIR:-}" && test -f "$SIGIC_POOL_DIR/pgbouncer.log"; then
            python3 scripts/ci/sanitize-log.py "$SIGIC_POOL_DIR/pgbouncer.log" > TestResults/diagnostics/pgbouncer.log
          fi
          docker logs "$SIGIC_POSTGRES_CONTAINER" 2>&1 | python3 scripts/ci/sanitize-log.py > TestResults/diagnostics/postgres.log
      - name: Stop own pooler
        if: always()
        run: bash scripts/ci/stop-pgbouncer.sh
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: TestResults/
          if-no-files-found: warn

  frontend:
    name: Vitest and build - ${{ matrix.channel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        channel: [SIGIC.POS, SIGIC.Web]
    defaults:
      run:
        working-directory: src/${{ matrix.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/${{ matrix.channel }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run Vitest
        run: |
          mkdir -p "$GITHUB_WORKSPACE/TestResults/${{ matrix.channel }}"
          npm test -- --reporter=default --reporter=junit --outputFile="$GITHUB_WORKSPACE/TestResults/${{ matrix.channel }}/vitest.xml"
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.channel }}-${{ github.sha }}
          path: TestResults/${{ matrix.channel }}/
          if-no-files-found: warn

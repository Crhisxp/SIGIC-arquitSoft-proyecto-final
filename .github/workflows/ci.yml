name: CI/CD Pipeline - SIGIC Ferretería v2.2

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-verify:
    name: .NET 8, PostgreSQL 16, PgBouncer 1.22.1 & Domain coverage >=95%
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SIGIC_DB_HOST: 127.0.0.1
      SIGIC_DB_PORT: '54329'
      SIGIC_DB_NAME: postgres
      SIGIC_DB_ADMIN_USER: postgres
      SIGIC_DB_ADMIN_PASSWORD: sigic_ci_ephemeral
      SIGIC_DB_USER: sigic_app
      SIGIC_DB_PASSWORD: sigic_fixture_ephemeral
      SIGIC_POS_CONNECTION_STRING: Host=127.0.0.1;Port=6432;Database=sigic_pos_pool;Username=sigic_app;Password=sigic_fixture_ephemeral;Pooling=false
      SIGIC_WEB_CONNECTION_STRING: Host=127.0.0.1;Port=6432;Database=sigic_web_pool;Username=sigic_app;Password=sigic_fixture_ephemeral;Pooling=false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Start disposable PostgreSQL 16
        run: >-
          docker run --detach --name sigic-ci-postgres
          --cidfile "$RUNNER_TEMP/sigic-postgres.cid"
          --env "POSTGRES_USER=$SIGIC_DB_ADMIN_USER"
          --env "POSTGRES_PASSWORD=$SIGIC_DB_ADMIN_PASSWORD"
          --env "POSTGRES_DB=$SIGIC_DB_NAME"
          --publish "127.0.0.1:${SIGIC_DB_PORT}:5432"
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
          postgres:16 -c max_connections=300

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install PostgreSQL client and pooler build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client build-essential pkg-config libevent-dev libssl-dev curl

      - name: Test coverage aggregation
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Initialize database and verify both PgBouncer aliases
        run: bash scripts/ci/bootstrap.sh

      - name: Assert effective PostgreSQL version and connection budget
        run: |
          export PGHOST="$SIGIC_DB_HOST" PGPORT="$SIGIC_DB_PORT" PGDATABASE="$SIGIC_DB_NAME"
          export PGUSER="$SIGIC_DB_ADMIN_USER" PGPASSWORD="$SIGIC_DB_ADMIN_PASSWORD"
          psql -X -v ON_ERROR_STOP=1 -c 'SHOW server_version' -c 'SHOW max_connections'
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT current_setting('server_version_num')::int / 10000 = 16 AND current_setting('max_connections')::int = 300" | grep -qx t

      - name: Restore and build Release
        run: |
          dotnet restore SIGIC.sln
          dotnet build SIGIC.sln -c Release --no-restore -warnaserror

      - name: Run four sequential suites and verify TRX and coverage
        run: |
          bash scripts/ci/test-backend.sh
          for layer in Domain Application Infrastructure WebApi; do
            test -n "$(find "TestResults/$layer" -type f -name coverage.cobertura.xml -print -quit)"
          done

      - name: Collect sanitized diagnostics
        if: failure()
        run: |
          mkdir -p TestResults/diagnostics
          if [[ -f scripts/ci/sanitize-log.py ]]; then
            if [[ -n "${SIGIC_POOL_DIR:-}" && -f "$SIGIC_POOL_DIR/pgbouncer.log" ]]; then
              python3 scripts/ci/sanitize-log.py "$SIGIC_POOL_DIR/pgbouncer.log" > TestResults/diagnostics/pgbouncer.log
            fi
            if [[ -s "$RUNNER_TEMP/sigic-postgres.cid" ]]; then
              cid=$(cat "$RUNNER_TEMP/sigic-postgres.cid")
              docker logs "$cid" 2>&1 | python3 scripts/ci/sanitize-log.py > TestResults/diagnostics/postgres.log
              docker inspect --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' "$cid" > TestResults/diagnostics/postgres-state.txt
            fi
          fi

      - name: Stop own PgBouncer
        if: always()
        run: |
          if [[ -f scripts/ci/stop-pgbouncer.sh ]]; then bash scripts/ci/stop-pgbouncer.sh; fi

      - name: Remove disposable PostgreSQL and its anonymous volume
        if: always()
        run: |
          if [[ -s "$RUNNER_TEMP/sigic-postgres.cid" ]]; then
            docker rm --force --volumes "$(cat "$RUNNER_TEMP/sigic-postgres.cid")"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ github.sha }}
          path: TestResults/
          if-no-files-found: warn

  frontend:
    name: Vitest and build - ${{ matrix.channel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        channel: [SIGIC.POS, SIGIC.Web]
    defaults:
      run:
        shell: bash
        working-directory: src/${{ matrix.channel }}
    env:
      SIGIC_CHANNEL: ${{ matrix.channel }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/${{ matrix.channel }}/package-lock.json
      - run: npm ci
      - name: Test channel and require JUnit evidence
        run: |
          report_dir="$GITHUB_WORKSPACE/TestResults/$SIGIC_CHANNEL"
          mkdir -p "$report_dir"
          npm test -- --reporter=default --reporter=junit --outputFile="$report_dir/vitest.xml"
          test -s "$report_dir/vitest.xml"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-${{ matrix.channel }}-${{ github.sha }}
          path: TestResults/${{ matrix.channel }}/
          if-no-files-found: warn

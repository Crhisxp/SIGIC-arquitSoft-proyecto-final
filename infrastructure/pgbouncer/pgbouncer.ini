; Production reference only; CI/local render pgbouncer.ini.in with bootstrap.sh.
; Replace postgres.internal with deployment DNS and mount a matching SCRAM file.
[databases]
sigic_pos_pool = host=postgres.internal port=5432 dbname=postgres pool_size=50 max_db_connections=50 reserve_pool=0
sigic_web_pool = host=postgres.internal port=5432 dbname=postgres pool_size=30 max_db_connections=30 reserve_pool=0

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 500
reserve_pool_size = 0
; 1.22.1 supports this timeout globally, not as a per-database option.
; Separate instances are required if production needs different queue policies.
query_wait_timeout = 3
stats_users = sigic_monitor

[databases]
; Segregación estricta de pools (RNF-CON-001, DA-02) sobre PostgreSQL 16
; Pool dedicado para Mostrador POS en red local LAN (alta prioridad, ultra baja latencia, 50 conexiones)
sigic_pos_pool = host=172.17.0.2 port=5432 auth_user=sigic_app_user dbname=postgres pool_mode=transaction pool_size=50 reserve_pool=5 max_db_connections=50

; Pool desacoplado para Portal Web WAN (control de backpressure y queue timeout de 3 s, 30 conexiones)
sigic_web_pool = host=172.17.0.2 port=5432 auth_user=sigic_app_user dbname=postgres pool_mode=transaction pool_size=30 reserve_pool=0 max_db_connections=30 query_wait_timeout=3

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = sigic_app, sigic_app_user
stats_users = sigic_monitor

; Políticas globales de pooling en modo transacción
pool_mode = transaction
server_reset_query = DISCARD ALL
max_client_conn = 500
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 100
max_user_connections = 100

; Configuración de timeouts y resiliencia
server_idle_timeout = 600
client_idle_timeout = 0
query_timeout = 0
query_wait_timeout = 10
client_login_timeout = 15
